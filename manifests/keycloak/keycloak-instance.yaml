apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: tenant-poc-keycloak
  namespace: keycloak-system
spec:
  instances: 1
  hostname:
    hostname: PLACEHOLDER_KEYCLOAK_HOSTNAME
    strict: false
  proxy:
    headers: xforwarded
  http:
    httpEnabled: true
  unsupported:
    podTemplate:
      spec:
        containers:
          - name: keycloak
            args:
              - --verbose
              - start
              - --import-realm
            volumeMounts:
              - name: realms
                mountPath: /opt/keycloak/data/import
        volumes:
          - name: realms
            configMap:
              name: keycloak-realms
