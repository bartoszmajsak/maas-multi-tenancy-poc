apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Shared MaaS API replacements - included by tenant overlays
# Components can define replacements that reference resources from the including overlay

replacements:
  - source:
      kind: ConfigMap
      name: maas-parameters
      fieldPath: data.maas-api-image
    targets:
      - select:
          kind: Deployment
          name: maas-api
        fieldPaths:
          - spec.template.spec.containers.[name=maas-api].image

  - source:
      kind: ConfigMap
      name: maas-parameters
      fieldPath: data.instance-name
    targets:
      - select:
          kind: Deployment
          name: maas-api
        fieldPaths:
          - spec.template.spec.containers.[name=maas-api].env.[name=INSTANCE_NAME].value

  # NOTE: gateway-name MUST come before gateway-namespace due to kustomize bug
  # with adjacent env var replacements (later replacement overwrites earlier ones)
  - source:
      kind: ConfigMap
      name: maas-parameters
      fieldPath: data.gateway-name
    targets:
      - select:
          kind: HTTPRoute
          name: maas-api-route
        fieldPaths:
          - spec.parentRefs.0.name
      - select:
          kind: Deployment
          name: maas-api
        fieldPaths:
          - spec.template.spec.containers.[name=maas-api].env.[name=GATEWAY_NAME].value

  - source:
      kind: ConfigMap
      name: maas-parameters
      fieldPath: data.gateway-namespace
    targets:
      - select:
          kind: HTTPRoute
          name: maas-api-route
        fieldPaths:
          - spec.parentRefs.0.namespace
      - select:
          kind: DestinationRule
          name: maas-api-backend-tls
        fieldPaths:
          - metadata.namespace
      - select:
          kind: Deployment
          name: maas-api
        fieldPaths:
          - spec.template.spec.containers.[name=maas-api].env.[name=GATEWAY_NAMESPACE].value

  - source:
      kind: ConfigMap
      name: maas-parameters
      fieldPath: data.keycloak-jwks-url
    targets:
      - select:
          kind: AuthPolicy
          name: maas-api-auth-policy
        fieldPaths:
          - spec.rules.authentication.keycloak-jwt.jwt.jwksUrl

  - source:
      kind: ConfigMap
      name: maas-parameters
      fieldPath: data.gateway-sa-audience
    targets:
      - select:
          kind: AuthPolicy
          name: maas-api-auth-policy
        fieldPaths:
          - spec.rules.authentication.openshift-identities.kubernetesTokenReview.audiences.1
