apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base MaaS API configuration shared across all tenants
# Tenants extend this by setting namespace and adding tenant-specific patches

resources:
  - https://github.com/opendatahub-io/models-as-a-service/deployment/base/maas-api/overlays/tls?ref=main

patches:
# Delete upstream tier-mapping (tenants provide their own)
- target:
    kind: ConfigMap
    name: tier-to-group-mapping
  patch: |
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: tier-to-group-mapping

# Add AuthPolicy authentication and normalize identity fields (Keycloak JWT + SA token)
- target:
    group: kuadrant.io
    version: v1
    kind: AuthPolicy
    name: maas-api-auth-policy
  patch: |-
    apiVersion: kuadrant.io/v1
    kind: AuthPolicy
    metadata:
      name: maas-api-auth-policy
    spec:
      rules:
        authentication:
          keycloak-jwt:
            credentials:
              authorizationHeader:
                prefix: Bearer
            jwt:
              jwksUrl: PLACEHOLDER_JWKS_URL
            metrics: false
            priority: 0
            overrides:
              username:
                selector: auth.identity.preferred_username
              groups:
                selector: auth.identity.groups
          openshift-identities:
            kubernetesTokenReview:
              audiences:
                - https://kubernetes.default.svc
                - PLACEHOLDER_GATEWAY_SA
            priority: 1
            overrides:
              username:
                selector: auth.identity.user.username.@extract:{"sep":":","pos":3}
              groups:
                selector: auth.identity.user.groups
        response:
          success:
            headers:
              X-MaaS-Group:
                metrics: false
                plain:
                  selector: auth.identity.groups.@tostr
                priority: 0
              X-MaaS-Username:
                metrics: false
                plain:
                  selector: auth.identity.username
                priority: 0

# Inject gateway and instance env vars into Deployment (values set via replacements in tenant overlay)
- target:
    kind: Deployment
    name: maas-api
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: maas-api
    spec:
      template:
        spec:
          containers:
          - name: maas-api
            env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INSTANCE_NAME
              value: PLACEHOLDER_INSTANCE_NAME
            - name: GATEWAY_NAMESPACE
              value: PLACEHOLDER_GATEWAY_NAMESPACE
            - name: GATEWAY_NAME
              value: PLACEHOLDER_GATEWAY_NAME
