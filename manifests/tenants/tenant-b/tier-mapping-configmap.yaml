# Tier to Group Mapping for Tenant-B (Apex Industries)
# Modern tier naming with corporate groups
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tier-to-group-mapping
  namespace: tenant-b
  labels:
    app: maas-api
    component: tier-mapping
data:
  tiers: |
    # Basic tier - contractors and external partners
    - name: basic
      displayName: "Basic"
      level: 0
      groups:
        - Contractors
        - External-Partners
        - system:authenticated

    # Pro tier - full-time employees
    - name: pro
      displayName: "Pro"
      level: 1
      groups:
        - Full-Time-Employees
        - Product-Teams

    # Max tier - executives and priority users
    - name: max
      displayName: "Max"
      level: 2
      groups:
        - C-Suite
        - Product-Security
        - VIP-Users
