# Token Rate Limiting Policy for Tenant-B (Apex Industries)
# Conservative enterprise limits with clear SLA tiers
---
apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: apex-industries-token-limits
  namespace: openshift-ingress
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: tenant-b-gateway
  limits:
    # Basic tier - 10K tokens/min (contractors, limited access)
    basic-tokens:
      rates:
        - limit: 10000
          window: 1m
      when:
        - predicate: auth.identity.tier == "basic" && !request.path.endsWith("/v1/models")
      counters:
        - expression: auth.identity.userid

    # Pro tier - 60K tokens/min (standard employee access)
    pro-tokens:
      rates:
        - limit: 60000
          window: 1m
      when:
        - predicate: auth.identity.tier == "pro" && !request.path.endsWith("/v1/models")
      counters:
        - expression: auth.identity.userid

    # Max tier - 200K tokens/min with 2M/hour burst (executives, priority)
    max-tokens:
      rates:
        - limit: 200000
          window: 1m
        - limit: 2000000
          window: 1h
      when:
        - predicate: auth.identity.tier == "max" && !request.path.endsWith("/v1/models")
      counters:
        - expression: auth.identity.userid
