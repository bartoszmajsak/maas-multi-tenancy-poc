apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tenant-b

resources:
  - ../../base/maas-api

# Tenant-B specific:
# - Delete ClusterRole (already created by tenant-a, shared)
# - Rename ClusterRoleBinding to avoid conflict (each tenant needs their own binding)
patches:
- target:
    kind: ClusterRole
    name: maas-api
  patch: |
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: maas-api
- target:
    kind: ClusterRoleBinding
    name: maas-api
  patch: |-
    - op: replace
      path: /metadata/name
      value: maas-api-tenant-b
