# RBAC for Mistral Security model in tenant-b
# Grants access based on tier mappings (tenant-b uses: basic, pro, max):
#   - Basic: Contractors, External-Partners, system:authenticated
#   - Pro: Full-Time-Employees, Product-Teams
#   - Max: C-Suite, Product-Security, VIP-Users
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-post-access
  namespace: tenant-b
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["llminferenceservices"]
    verbs: ["post"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-post-access-binding
  namespace: tenant-b
subjects:
  - kind: Group
    name: system:serviceaccounts:tenant-b-tier-basic
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: system:serviceaccounts:tenant-b-tier-pro
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: system:serviceaccounts:tenant-b-tier-max
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: model-post-access
  apiGroup: rbac.authorization.k8s.io
