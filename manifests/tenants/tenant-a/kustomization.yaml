apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tenant-A configuration
# NOTE: Resources specify their own namespaces (tenant-a for app, openshift-ingress for policies)

resources:
  - maas-api/
  - tier-mapping-configmap.yaml
  - models
  - policies/

components:
  - ../base/maas-api-replacements  # Shared MaaS API replacements

configMapGenerator:
  - name: maas-parameters
    namespace: tenant-a
    envs:
      - params.env
generatorOptions:
  disableNameSuffixHash: true

# Only tenant-specific replacements (gateway policies have -tenant-a suffix)
replacements:
  - source:
      kind: ConfigMap
      name: maas-parameters
      fieldPath: data.gateway-name
    targets:
      - select:
          group: kuadrant.io
          version: v1
          kind: AuthPolicy
          name: gateway-auth-policy-tenant-a
        fieldPaths:
          - spec.targetRef.name
      - select:
          group: kuadrant.io
          version: v1
          kind: RateLimitPolicy
          name: gateway-rate-limits-tenant-a
        fieldPaths:
          - spec.targetRef.name
      - select:
          group: kuadrant.io
          version: v1alpha1
          kind: TokenRateLimitPolicy
          name: gateway-token-rate-limits-tenant-a
        fieldPaths:
          - spec.targetRef.name

  - source:
      kind: ConfigMap
      name: maas-parameters
      fieldPath: data.maas-tier-lookup-url
    targets:
      - select:
          group: kuadrant.io
          version: v1
          kind: AuthPolicy
          name: gateway-auth-policy-tenant-a
        fieldPaths:
          - spec.rules.metadata.matchedTier.http.url

  - source:
      kind: ConfigMap
      name: maas-parameters
      fieldPath: data.gateway-sa-audience
    targets:
      - select:
          group: kuadrant.io
          version: v1
          kind: AuthPolicy
          name: gateway-auth-policy-tenant-a
        fieldPaths:
          - spec.rules.authentication.service-accounts.kubernetesTokenReview.audiences.0
