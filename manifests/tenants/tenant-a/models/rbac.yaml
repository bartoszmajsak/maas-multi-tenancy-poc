# RBAC for CodeLlama model in tenant-a
# Grants access based on tier mappings:
#   - Free: Project-Alpha, system:authenticated
#   - Premium: Engineering
#   - Enterprise: Site-Reliability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-post-access
  namespace: tenant-a
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["llminferenceservices"]
    verbs: ["post"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-post-access-binding
  namespace: tenant-a
subjects:
  - kind: Group
    name: system:serviceaccounts:tenant-a-tier-free
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: system:serviceaccounts:tenant-a-tier-premium
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: system:serviceaccounts:tenant-a-tier-enterprise
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: model-post-access
  apiGroup: rbac.authorization.k8s.io
