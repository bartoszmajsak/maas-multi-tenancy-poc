# Tier to Group Mapping for Tenant-A (Nebula Labs)
# Classic tier naming with startup-friendly groups
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tier-to-group-mapping
  namespace: tenant-a
  labels:
    app: maas-api
    component: tier-mapping
data:
  tiers: |
    # Free tier - open experimentation for all
    - name: free
      displayName: "Free"
      level: 0
      groups:
        - Indie-Hackers
        - system:authenticated

    # Premium tier - for active contributors
    - name: premium
      displayName: "Premium"
      level: 1
      groups:
        - Open-Source-Contributors
        - Engineering

    # Enterprise tier - power users and maintainers
    - name: enterprise
      displayName: "Enterprise"
      level: 2
      groups:
        - Core-Maintainers
        - Site-Reliability
