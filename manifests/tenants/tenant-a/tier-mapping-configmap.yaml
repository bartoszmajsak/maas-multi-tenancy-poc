# Tier to Group Mapping for Tenant-A
# Maps Keycloak groups to rate limit tiers
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tier-to-group-mapping
  namespace: tenant-a
  labels:
    app: maas-api
    component: tier-mapping
data:
  tiers: |
    # Free tier - default for all authenticated users
    - name: free
      displayName: Free Tier
      level: 0
      groups:
        - Project-Alpha
        - system:authenticated

    # Premium tier - for engineering teams
    - name: premium
      displayName: Premium Tier
      level: 1
      groups:
        - Engineering

    # Enterprise tier - for SRE with highest priority
    - name: enterprise
      displayName: Enterprise Tier
      level: 2
      groups:
        - Site-Reliability
